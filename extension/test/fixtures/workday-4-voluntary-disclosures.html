<!--
  Workday application, page 4 of 5: Voluntary Disclosures.
  Rebuilt by hand from Workday's structure (see page 1). Each question is a
  dropdown button; the terms checkbox is the person's to tick.
-->
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBar"><span data-automation-id="progressBarActiveStep">Voluntary Disclosures</span></div>
  <h2>Voluntary Disclosures</h2>
  <div data-automation-id="formField-gender">
    <label id="label-gender">Gender</label>
    <button type="button" aria-haspopup="listbox" data-automation-id="gender" id="personalInfoUS--gender" aria-labelledby="label-gender">Select One</button>
  </div>
  <div data-automation-id="formField-hispanicOrLatino">
    <label id="label-hisp">Are you Hispanic or Latino?</label>
    <button type="button" aria-haspopup="listbox" data-automation-id="hispanicOrLatino" aria-labelledby="label-hisp">Select One</button>
  </div>
  <div data-automation-id="formField-ethnicityDropdown">
    <label id="label-eth">Please select the ethnicity which most accurately describes how you identify yourself</label>
    <button type="button" aria-haspopup="listbox" data-automation-id="ethnicityDropdown" aria-labelledby="label-eth">Select One</button>
  </div>
  <div data-automation-id="formField-veteranStatus">
    <label id="label-vet">Veteran Status</label>
    <button type="button" aria-haspopup="listbox" data-automation-id="veteranStatus" aria-labelledby="label-vet">Select One</button>
  </div>
  <div data-automation-id="formField-agreementCheckbox">
    <label><input type="checkbox" data-automation-id="agreementCheckbox" /> I have read and consent to the terms and conditions.</label>
  </div>
  <div data-automation-id="pageFooter">
    <button type="button" data-automation-id="bottom-navigation-previous-button">Back</button>
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </div>
</div>
