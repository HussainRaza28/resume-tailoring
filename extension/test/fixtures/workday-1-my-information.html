<!--
  Workday application, page 1 of 5: My Information.
  Rebuilt by hand from the structure Workday applications use: formField-*
  wrappers, data-automation-id on each field, and dropdowns that are buttons
  opening a list box. Not a capture of a live page (Workday only shows these
  pages after signing in); the company is made up.
-->
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBar"><span data-automation-id="progressBarActiveStep">My Information</span></div>
  <h2>My Information</h2>
  <div data-automation-id="formField-sourcePrompt">
    <label for="input-1">How Did You Hear About Us?<abbr title="required">*</abbr></label>
    <div data-automation-id="selectedItemList"></div>
    <input id="input-1" data-automation-id="searchBox" type="text" placeholder="Search" />
  </div>
  <fieldset data-automation-id="formField-candidateIsPreviousWorker">
    <legend>Have you previously worked for Larkspur Freight?<abbr title="required">*</abbr></legend>
    <label><input type="radio" name="candidateIsPreviousWorker" value="true" /> Yes</label>
    <label><input type="radio" name="candidateIsPreviousWorker" value="false" /> No</label>
  </fieldset>
  <div data-automation-id="formField-countryDropdown">
    <label id="label-country">Country<abbr title="required">*</abbr></label>
    <button type="button" aria-haspopup="listbox" data-automation-id="countryDropdown" aria-labelledby="label-country">Select One</button>
  </div>
  <div data-automation-id="formField-legalNameSection_firstName">
    <label for="input-4">First Name<abbr title="required">*</abbr></label>
    <input id="input-4" data-automation-id="legalNameSection_firstName" type="text" />
  </div>
  <div data-automation-id="formField-legalNameSection_lastName">
    <label for="input-5">Last Name<abbr title="required">*</abbr></label>
    <input id="input-5" data-automation-id="legalNameSection_lastName" type="text" />
  </div>
  <div data-automation-id="formField-addressSection_addressLine1">
    <label for="input-6">Address Line 1</label>
    <input id="input-6" data-automation-id="addressSection_addressLine1" type="text" />
  </div>
  <div data-automation-id="formField-addressSection_city">
    <label for="input-7">City</label>
    <input id="input-7" data-automation-id="addressSection_city" type="text" />
  </div>
  <div data-automation-id="formField-addressSection_countryRegion">
    <label id="label-state">State</label>
    <button type="button" aria-haspopup="listbox" data-automation-id="addressSection_countryRegion" aria-labelledby="label-state">Select One</button>
  </div>
  <div data-automation-id="formField-addressSection_postalCode">
    <label for="input-9">Postal Code</label>
    <input id="input-9" data-automation-id="addressSection_postalCode" type="text" />
  </div>
  <div data-automation-id="formField-email">
    <label for="input-10">Email Address<abbr title="required">*</abbr></label>
    <input id="input-10" data-automation-id="email" type="text" />
  </div>
  <div data-automation-id="formField-phone-device-type">
    <label id="label-device">Phone Device Type<abbr title="required">*</abbr></label>
    <button type="button" aria-haspopup="listbox" data-automation-id="phone-device-type" aria-labelledby="label-device">Select One</button>
  </div>
  <div data-automation-id="formField-countryPhoneCode">
    <label for="input-11">Country Phone Code<abbr title="required">*</abbr></label>
    <div data-automation-id="selectedItemList"></div>
    <input id="input-11" data-automation-id="searchBox" type="text" placeholder="Search" />
  </div>
  <div data-automation-id="formField-phone-number">
    <label for="input-12">Phone Number<abbr title="required">*</abbr></label>
    <input id="input-12" data-automation-id="phone-number" type="text" />
  </div>
  <div data-automation-id="pageFooter">
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </div>
</div>
