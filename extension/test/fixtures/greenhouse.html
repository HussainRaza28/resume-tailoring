<!--
  A Greenhouse application form (classic boards.greenhouse.io/<company>/jobs/<id>).
  Rebuilt by hand from the structure Greenhouse forms use: ids such as first_name,
  the job_application[...] names, the answers_attributes custom questions, and
  the EEOC selects. The education and employment blocks take dates as a month
  select and a year box; the form shows two employment blocks. It isn't a capture of a live page, and the company is made up.
-->
<div id="application">
  <form id="application_form" action="/embed/job_app" method="post" enctype="multipart/form-data">
    <div id="main_fields">
      <div class="field">
        <label for="first_name">First Name <span class="asterisk">*</span></label>
        <input type="text" id="first_name" name="job_application[first_name]" aria-required="true" />
      </div>
      <div class="field">
        <label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input type="text" id="last_name" name="job_application[last_name]" aria-required="true" />
      </div>
      <div class="field">
        <label for="email">Email <span class="asterisk">*</span></label>
        <input type="text" id="email" name="job_application[email]" aria-required="true" />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="job_application[phone]" />
      </div>
      <div class="field">
        <label for="job_application_location">Location (City)</label>
        <input type="text" id="job_application_location" name="job_application[location]" autocomplete="off" />
      </div>
      <div class="field" id="resume_fieldset">
        <label>Resume/CV <span class="asterisk">*</span></label>
        <div class="attach-or-paste">
          <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx,.txt,.rtf" style="display: none" />
          <button type="button" class="button" data-source="attach">Attach</button>
        </div>
      </div>
      <div class="field" id="cover_letter_fieldset">
        <label>Cover Letter</label>
        <input type="file" id="cover_letter" name="job_application[cover_letter]" style="display: none" />
      </div>
    </div>

    <div id="education_section">
      <div class="field">
        <label for="education_school_name_0">School</label>
        <select id="education_school_name_0" name="job_application[educations][][school_name_id]">
          <option value="">Select a School</option>
          <option value="1001">Springfield Community College</option>
          <option value="1002">State University</option>
          <option value="1003">University of Illinois Urbana-Champaign</option>
        </select>
      </div>
      <div class="field">
        <label for="education_degree_0">Degree</label>
        <select id="education_degree_0" name="job_application[educations][][degree_id]">
          <option value="">Select a Degree</option>
          <option value="1">High School</option>
          <option value="2">Associate's Degree</option>
          <option value="3">Bachelor's Degree</option>
          <option value="4">Master's Degree</option>
        </select>
      </div>
      <div class="field">
        <label for="education_discipline_0">Discipline</label>
        <select id="education_discipline_0" name="job_application[educations][][discipline_id]">
          <option value="">Select a Discipline</option>
          <option value="10">Biology</option>
          <option value="11">Computer Science</option>
          <option value="12">Mathematics</option>
        </select>
      </div>
      <div class="field">
        <label for="education_start_date_month_0">Start Date</label>
        <select id="education_start_date_month_0" name="job_application[educations][][start_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
        <input type="text" id="education_start_date_year_0" name="job_application[educations][][start_date][year]" placeholder="YYYY" />
      </div>
      <div class="field">
        <label for="education_end_date_month_0">End Date</label>
        <select id="education_end_date_month_0" name="job_application[educations][][end_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
        <input type="text" id="education_end_date_year_0" name="job_application[educations][][end_date][year]" placeholder="YYYY" />
      </div>
    </div>

    <div id="employment_section">
      <div class="employment">
        <div class="field">
          <label for="employment_company_name_0">Company Name</label>
          <input type="text" id="employment_company_name_0" name="job_application[employments][][company_name]" />
        </div>
        <div class="field">
          <label for="employment_title_0">Title</label>
          <input type="text" id="employment_title_0" name="job_application[employments][][title]" />
        </div>
        <div class="field">
          <label for="employment_start_date_month_0">Start Date</label>
        <select id="employment_start_date_month_0" name="job_application[employments][][start_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
          <input type="text" id="employment_start_date_year_0" name="job_application[employments][][start_date][year]" placeholder="YYYY" />
        </div>
        <div class="field">
          <label for="employment_end_date_month_0">End Date</label>
        <select id="employment_end_date_month_0" name="job_application[employments][][end_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
          <input type="text" id="employment_end_date_year_0" name="job_application[employments][][end_date][year]" placeholder="YYYY" />
        </div>
        <label><input type="checkbox" id="employment_current_0" name="job_application[employments][][current]" value="1" /> Current role</label>
      </div>
      <div class="employment">
        <div class="field">
          <label for="employment_company_name_1">Company Name</label>
          <input type="text" id="employment_company_name_1" name="job_application[employments][][company_name]" />
        </div>
        <div class="field">
          <label for="employment_title_1">Title</label>
          <input type="text" id="employment_title_1" name="job_application[employments][][title]" />
        </div>
        <div class="field">
          <label for="employment_start_date_month_1">Start Date</label>
        <select id="employment_start_date_month_1" name="job_application[employments][][start_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
          <input type="text" id="employment_start_date_year_1" name="job_application[employments][][start_date][year]" placeholder="YYYY" />
        </div>
        <div class="field">
          <label for="employment_end_date_month_1">End Date</label>
        <select id="employment_end_date_month_1" name="job_application[employments][][end_date][month]">
          <option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
          <input type="text" id="employment_end_date_year_1" name="job_application[employments][][end_date][year]" placeholder="YYYY" />
        </div>
        <label><input type="checkbox" id="employment_current_1" name="job_application[employments][][current]" value="1" /> Current role</label>
      </div>
    </div>

    <div id="custom_fields">
      <div class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_1_text_value">Website</label>
        <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_2_boolean_value">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
        <select id="job_application_answers_attributes_2_boolean_value" name="job_application[answers_attributes][2][boolean_value]">
          <option value="">--</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_3_boolean_value">Will you now or in the future require sponsorship for employment visa status? <span class="asterisk">*</span></label>
        <select id="job_application_answers_attributes_3_boolean_value" name="job_application[answers_attributes][3][boolean_value]">
          <option value="">--</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_4_text_value">Why do you want to work at Larkspur Freight? <span class="asterisk">*</span></label>
        <textarea id="job_application_answers_attributes_4_text_value" name="job_application[answers_attributes][4][text_value]" rows="5"></textarea>
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_5_text_value">How did you hear about this job?</label>
        <input type="text" id="job_application_answers_attributes_5_text_value" name="job_application[answers_attributes][5][text_value]" />
      </div>
    </div>

    <div id="eeoc_fields">
      <div class="field">
        <label for="job_application_gender">Gender</label>
        <select id="job_application_gender" name="job_application[gender]">
          <option value="">Please select</option>
          <option value="1">Male</option>
          <option value="2">Female</option>
          <option value="3">Decline To Self Identify</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_hispanic_ethnicity">Are you Hispanic/Latino?</label>
        <select id="job_application_hispanic_ethnicity" name="job_application[hispanic_ethnicity]">
          <option value="">Please select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Decline To Self Identify">Decline To Self Identify</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_race">Race</label>
        <select id="job_application_race" name="job_application[race]">
          <option value="">Please select</option>
          <option value="1">American Indian or Alaskan Native</option>
          <option value="2">Asian</option>
          <option value="3">Black or African American</option>
          <option value="4">White</option>
          <option value="5">Two or More Races</option>
          <option value="8">Decline To Self Identify</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_veteran_status">Veteran Status</label>
        <select id="job_application_veteran_status" name="job_application[veteran_status]">
          <option value="">Please select</option>
          <option value="1">I am not a protected veteran</option>
          <option value="2">I identify as one or more of the classifications of protected veteran</option>
          <option value="3">I don't wish to answer</option>
        </select>
      </div>
      <div class="field">
        <label for="job_application_disability_status">Disability Status</label>
        <select id="job_application_disability_status" name="job_application[disability_status]">
          <option value="">Please select</option>
          <option value="1">Yes, I have a disability (or previously had a disability)</option>
          <option value="2">No, I do not have a disability</option>
          <option value="3">I do not want to answer</option>
        </select>
      </div>
    </div>

    <div id="submit_buttons">
      <input type="button" id="submit_app" value="Submit Application" />
    </div>
  </form>
</div>
