<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tailor Autofill profile</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <h1>Tailor Autofill</h1>
        <p class="muted">Fill this in once. It stays in this browser and is only used when you press Autofill.</p>
      </header>

      <form id="profile" novalidate></form>

      <section class="card" aria-labelledby="resume-title">
        <h2 id="resume-title">Resume</h2>
        <p class="muted" id="resume-status">No resume yet.</p>
        <div class="row">
          <label class="button" for="resume-file">Choose PDF</label>
          <input id="resume-file" type="file" accept="application/pdf" hidden />
          <button type="button" id="resume-remove" class="secondary" hidden>Remove</button>
        </div>
      </section>

      <div class="save-bar">
        <span id="saved" class="muted" role="status"></span>
        <button type="submit" form="profile">Save profile</button>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
