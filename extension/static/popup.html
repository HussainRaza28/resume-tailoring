<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tailor Autofill</title>
    <link rel="stylesheet" href="page.css" />
    <style>
      body { width: 300px; }
      .popup { padding: 16px; display: grid; gap: 12px; }
    </style>
  </head>
  <body>
    <main class="popup">
      <h1 style="font-size: 16px">Tailor Autofill</h1>
      <p id="who" class="muted"></p>
      <button type="button" id="autofill">Autofill this page</button>
      <p id="result" class="muted" role="status"></p>
      <button type="button" id="edit" class="secondary">Edit profile</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
