name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAILOR_REQUIRE_TECTONIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Download Tectonic
        run: uv run python scripts/fetch_tectonic.py
      - name: Backend tests
        run: uv run pytest -v

  interface:
    name: Interface (Linux)
    runs-on: ubuntu-24.04
    env:
      TAILOR_REQUIRE_TECTONIC: "1"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked
      - name: Download Tectonic
        run: uv run python ../scripts/fetch_tectonic.py
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build the single-file interface
        run: npm run build
      - name: Browser tests (mock backend and the real Python bridge)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
