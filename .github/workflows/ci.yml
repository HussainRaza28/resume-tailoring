name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.1.0) runs everything below and then publishes a release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAILOR_REQUIRE_TECTONIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Download Tectonic
        run: uv run python scripts/fetch_tectonic.py
      - name: Backend tests
        run: uv run pytest -v

  interface:
    name: Interface (Linux)
    runs-on: ubuntu-24.04
    env:
      TAILOR_REQUIRE_TECTONIC: "1"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked
      - name: Download Tectonic
        run: uv run python ../scripts/fetch_tectonic.py
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build the single-file interface
        run: npm run build
      - name: Browser tests (mock backend and the real Python bridge)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  extension:
    name: Autofill extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Tailor-Autofill-extension
          path: extension/dist/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: [test, interface]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Install Python dependencies
        run: uv sync --locked --group build
      - name: Download Tectonic
        run: uv run python scripts/fetch_tectonic.py
      - name: Build the app with PyInstaller
        run: uv run pyinstaller packaging/tailor.spec --noconfirm

      - name: Sign the app (ad hoc) and check the signature
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Tailor.app
          codesign --verify --deep --strict --verbose=2 dist/Tailor.app
      - name: Self-test the packaged app and open its window (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          dist/Tailor.app/Contents/MacOS/Tailor --self-test selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json
      - name: Make the disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/installer
          hdiutil create -volname Tailor -srcfolder dist/Tailor.app -ov -format UDZO dist/installer/Tailor-0.1.0-arm64.dmg

      - name: Self-test the packaged app and open its window (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          dist/Tailor/Tailor.exe --self-test selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json
      - name: Show the self-test report
        if: failure()
        run: cat selftest.json || echo "No self-test report was written."
      - name: Make the installer
        if: runner.os == 'Windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup --no-progress -y; fi
          "$ISCC" packaging/windows/tailor.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Tailor-${{ runner.os }}
          path: dist/installer/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip the extension
        run: |
          cd artifacts/Tailor-Autofill-extension
          zip -r "../Tailor-Autofill-extension-${GITHUB_REF_NAME#v}.zip" .
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tailor $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            artifacts/Tailor-macOS/*.dmg \
            artifacts/Tailor-Windows/*.exe \
            artifacts/Tailor-Autofill-extension-*.zip
