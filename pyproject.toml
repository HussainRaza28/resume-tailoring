[project]
name = "tailor"
version = "0.1.0"
description = "Desktop app that tailors a LaTeX resume to a job posting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=3.3.0",
    "httpx2>=2.16.0",
    "keyring>=25.7.0",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "tectonic: needs the real Tectonic binary",
]
